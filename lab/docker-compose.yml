services:
  # ════════════════════════════════════════════════════════
  # EOL versions (no official fix available)
  # ════════════════════════════════════════════════════════

  # ── PHP 5.6.40 (EOL, vulnerable since 5.4.0) ── FPM
  php56-fpm:
    image: php:5.6.40-fpm
    container_name: php2shell-fpm-56
    volumes:
      - ./webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./www.conf:/usr/local/etc/php-fpm.d/www.conf
    security_opt: [seccomp:unconfined]
    privileged: true
    command: >
      bash -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && php-fpm"

  # ── PHP 7.4.33 (EOL, last 7.x) ── FPM
  php74-fpm:
    image: php:7.4.33-fpm
    container_name: php2shell-fpm-74
    volumes:
      - ./webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./www.conf:/usr/local/etc/php-fpm.d/www.conf
    security_opt: [seccomp:unconfined]
